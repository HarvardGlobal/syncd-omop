<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="560" viewBox="0 0 1900 560"><rect width="1900" height="560" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/></marker></defs><text x="70" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#1f2937" text-anchor="start">How the synthetic concurrent disorders dataset was made</text><text x="70" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#5b6576" text-anchor="start">Real survey rates of co-occurring mental illness and substance use disorder were used to generate realistic synthetic patient records.</text><rect x="70" y="140" width="320" height="290" rx="16" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><circle cx="230.0" cy="140" r="22" fill="#2b6cb0"/><text x="230.0" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="230.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Public survey</text><text x="230.0" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#2b6cb0" text-anchor="middle">47,299</text><text x="230.0" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">adults in SAMHSA's 2024 national</text><text x="230.0" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">drug use & mental health survey</text><line x1="396" y1="285.0" x2="422" y2="285.0" stroke="#9aa3af" stroke-width="3" marker-end="url(#ah)"/><rect x="430" y="140" width="320" height="290" rx="16" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><circle cx="590.0" cy="140" r="22" fill="#2b6cb0"/><text x="590.0" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="590.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Estimate co-occurrence</text><text x="590.0" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#2b6cb0" text-anchor="middle">8.1%</text><text x="590.0" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">have both a mental illness and a</text><text x="590.0" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">substance use disorder</text><line x1="756" y1="285.0" x2="782" y2="285.0" stroke="#9aa3af" stroke-width="3" marker-end="url(#ah)"/><rect x="790" y="140" width="320" height="290" rx="16" fill="#eef1f5" stroke="#526077" stroke-width="2"/><circle cx="950.0" cy="140" r="22" fill="#526077"/><text x="950.0" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="950.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Build Synthea module</text><text x="950.0" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#526077" text-anchor="middle">4 groups</text><text x="950.0" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">each patient is assigned a group,</text><text x="950.0" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">then matching diagnoses & care</text><line x1="1116" y1="285.0" x2="1142" y2="285.0" stroke="#9aa3af" stroke-width="3" marker-end="url(#ah)"/><rect x="1150" y="140" width="320" height="290" rx="16" fill="#eef1f5" stroke="#526077" stroke-width="2"/><circle cx="1310.0" cy="140" r="22" fill="#526077"/><text x="1310.0" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="1310.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Generate patients</text><text x="1310.0" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#526077" text-anchor="middle">10,000</text><text x="1310.0" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">synthetic adults with 2 years of</text><text x="1310.0" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">health records (+1,000 pilot)</text><line x1="1476" y1="285.0" x2="1502" y2="285.0" stroke="#9aa3af" stroke-width="3" marker-end="url(#ah)"/><rect x="1510" y="140" width="320" height="290" rx="16" fill="#e7f4ec" stroke="#2f8050" stroke-width="2"/><circle cx="1670.0" cy="140" r="22" fill="#2f8050"/><text x="1670.0" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="1670.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Validate</text><text x="1670.0" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="bold" fill="#2f8050" text-anchor="middle">7.7% vs 7.8%</text><text x="1670.0" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">synthetic vs survey share with</text><text x="1670.0" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5b6576" text-anchor="middle">both disorders: a close match</text><rect x="70" y="480" width="1760" height="58" rx="29" fill="#ffffff" stroke="#9aa3af" stroke-width="2" /><text x="950.0" y="517" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#5b6576" text-anchor="middle">Loaded into PostgreSQL as OMOP CDM 5.4: 10,000 persons, group counts match exactly</text></svg>